language: php
dist: focal
notifications:
  email:
    on_success: never
    on_failure: change
  slack:
    secure: 
cache:
  yarn: true
  directories:
    - $HOME/.composer/cache
matrix:
  include:
    # PHP 7.4 on Focal: phpenv still provides 7.4 here. Tag build + deploy runs only on this job.
    - php: 7.4
      dist: focal
      before_deploy:
        - yes | gem update --system --force
        - gem install bundler
        - gem install uri
        - gem install faraday-net_http -v '3.3.0'
        - gem install logger
    # Travis phpenv does not ship PHP 8.5 (jammy tops out at 8.4). Bypass language: php
    # and install 8.5 from ppa:ondrej/php. TRAVIS_PHP_VERSION is unset, so deploy
    # (gated on php: '7.4') skips this job.
    - name: "PHP: 8.5"
      language: ruby
      dist: jammy
      before_install:
        - sudo add-apt-repository -y ppa:ondrej/php
        - sudo apt-get update -q
        - sudo apt-get install -y php8.5-cli php8.5-common php8.5-mbstring php8.5-xml php8.5-curl php8.5-zip
        - sudo update-alternatives --set php /usr/bin/php8.5
        - php -v
        - curl -sS https://getcomposer.org/installer | php
        - sudo mv composer.phar /usr/local/bin/composer
        - composer --version
before_script:
- nvm install 22.22.3
- nvm use 22.22.3
- npm install -g gulp-cli
- composer self-update --2
- composer validate --strict
- composer install
- composer check-platform-reqs
- yarn install
script:
- npm run build
deploy:
- provider: script
  script: chmod +x ./node_modules/@boldgrid/wordpress-tag-sync/release.sh && ./node_modules/@boldgrid/wordpress-tag-sync/release.sh
  # dpl v1 still stashes the working tree unless this is set; the zip is built in-job.
  skip_cleanup: true
  on:
    tags: true
    php: '7.4'
- provider: releases
  api_key: "${GITHUB_TOKEN}"
  file: post-and-page-builder.zip
  skip_cleanup: true
  on:
    tags: true
    php: '7.4'
